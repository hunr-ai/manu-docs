[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.3",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pyotp>=2.9.0",
    "pyyaml>=6.0.3",
    "redis>=7.4.0",
    "resend>=2.30.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
    "temporalio>=1.27.2",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "pytest>=9.0.3",
    "pytest-container>=0.4.4",
    "pytest-cov>=7.0.0",
    "rich>=15.0.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["config", "db"]
omit = ["db/migrations/env.py"]

[tool.coverage.report]
fail_under = 96
show_missing = true
