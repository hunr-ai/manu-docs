services:
  backend:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    container_name: manudocs-backend
    working_dir: /app
    command: sh -lc "uv run alembic -c db/alembic.ini upgrade head && exec uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app --reload-exclude logs --reload-exclude 'logs/*' --reload-exclude 'logs/**'"
    environment:
      ENVIRONMENT: dev
      LOG_DIR: /var/log/manudocs
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      UV_PROJECT_ENVIRONMENT: /app/.venv
      UV_LINK_MODE: copy
    ports:
      - "8000:8000"
    networks:
      - manudocs-network
    volumes:
      - ../../backend:/app
      - backend_logs:/var/log/manudocs
      - backend_venv:/app/.venv
      - backend_uv_cache:/root/.cache/uv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully

  email-worker:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    container_name: manudocs-email-worker
    working_dir: /app
    command: sh -lc "uv run python -m workflows.emails.worker"
    environment:
      ENVIRONMENT: dev
      LOG_DIR: /var/log/manudocs
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      UV_PROJECT_ENVIRONMENT: /app/.venv
      UV_LINK_MODE: copy
    networks:
      - manudocs-network
    volumes:
      - ../../backend:/app
      - backend_logs:/var/log/manudocs
      - backend_venv:/app/.venv
      - backend_uv_cache:/root/.cache/uv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully

  postgres:
    image: postgres:18-alpine
    container_name: manu-docs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: manudocsdb
      POSTGRES_USER: manudocsuser
      POSTGRES_PASSWORD: manudocs
    ports:
      - "5432:5432"
    networks:
      - manudocs-network
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manudocsuser -d manudocsdb"]
      interval: 10s
      timeout: 5s
      retries: 5